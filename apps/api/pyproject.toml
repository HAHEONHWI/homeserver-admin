[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homeserver-admin-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.121,<1",
  "psycopg[binary]>=3.3,<4",
  "pydantic-settings>=2.8,<3",
  "PyJWT[crypto]>=2.10,<3",
  "redis>=5,<8",
  "uvicorn[standard]>=0.34,<1",
  "webauthn>=3.0,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx2>=2.16,<3",
    "pytest>=8.3,<10",
    "ruff>=0.14,<1",
]
